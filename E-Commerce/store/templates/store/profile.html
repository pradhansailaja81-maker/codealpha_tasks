<!DOCTYPE html>
<html>
<head>
<title>My Profile</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.profile-card{
    width:100%;
    max-width:700px;
    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(15px);
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
    text-align:center;
}

/* Cover */

.cover{
    height:180px;
    background:linear-gradient(45deg,#ff6b6b,#ff9f43);
}

/* Avatar */

.avatar{
    width:130px;
    height:130px;
    border-radius:50%;
    background:white;
    color:#667eea;
    font-size:55px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:-65px auto 15px;
    border:5px solid white;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
    color:#333;
    margin-bottom:10px;
}

.email{
    color:#777;
    margin-bottom:25px;
}

/* Stats */

.stats{
    display:flex;
    justify-content:center;
    gap:25px;
    padding:20px;
    flex-wrap:wrap;
}

.stat-box{
    background:#f5f7ff;
    padding:20px;
    border-radius:15px;
    min-width:180px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.stat-box h2{
    color:#667eea;
    margin-bottom:8px;
}

.stat-box p{
    color:#666;
}

/* Buttons */

.buttons{
    padding:25px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    padding:14px 22px;
    border-radius:12px;
    margin:8px;
    color:white;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-4px);
}

.orders{
    background:linear-gradient(45deg,#28a745,#34ce57);
}

.wishlist{
    background:linear-gradient(45deg,#ff416c,#ff4b2b);
}

.home{
    background:linear-gradient(45deg,#007bff,#00bfff);
}

.logout{
    background:linear-gradient(45deg,#333,#111);
}

/* Footer */

.footer{
    padding:20px;
    color:#888;
    border-top:1px solid #eee;
}

@media(max-width:768px){

.stats{
    flex-direction:column;
    align-items:center;
}

.stat-box{
    width:90%;
}

}

</style>

</head>

<body>

<div class="profile-card">

    <div class="cover"></div>

    <div class="avatar">
        {{ user.username|first|upper }}
    </div>

    <h1>{{ user.username }}</h1>

    <div class="email">
        📧 {{ user.email }}
    </div>

    <div class="stats">

        <div class="stat-box">
            <h2>{{ total_orders }}</h2>
            <p>📦 Orders</p>
        </div>

        <div class="stat-box">
            <h2>{{ wishlist_count }}</h2>
            <p>❤️ Wishlist</p>
        </div>

        <div class="stat-box">
            <h2>VIP</h2>
            <p>👑 Member</p>
        </div>

    </div>

    <div class="buttons">

        <a href="{% url 'order_history' %}"
           class="btn orders">
           📦 My Orders
        </a>

        <a href="{% url 'wishlist' %}"
           class="btn wishlist">
           ❤️ Wishlist
        </a>

        <a href="/"
           class="btn home">
           🛒 Home
        </a>

        <a href="{% url 'logout' %}"
           class="btn logout">
           🚪 Logout
        </a>

    </div>

    <div class="footer">
        Welcome back, {{ user.username }} 🎉
    </div>

</div>

</body>
</html>
