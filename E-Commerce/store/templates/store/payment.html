<!DOCTYPE html>
<html>
<head>
<title>Payment Page</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.payment-card{
    width:100%;
    max-width:700px;
    background:white;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

.header{
    background:linear-gradient(45deg,#2874f0,#0d47a1);
    color:white;
    text-align:center;
    padding:30px;
}

.header h1{
    font-size:35px;
}

.content{
    padding:35px;
}

.total-box{
    background:#f5f7ff;
    padding:20px;
    border-radius:15px;
    margin-bottom:25px;
    text-align:center;
}

.total-box h2{
    color:#2874f0;
}

.option{
    border:2px solid #ddd;
    padding:18px;
    border-radius:15px;
    margin-bottom:15px;
    cursor:pointer;
    transition:0.3s;
}

.option:hover{
    border-color:#2874f0;
    background:#f5f9ff;
}

.option input{
    margin-right:10px;
    transform:scale(1.2);
}

.option label{
    font-size:18px;
    cursor:pointer;
}

.place-order{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#ff6b00,#ff9800);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.place-order:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(255,152,0,0.3);
}

.secure{
    text-align:center;
    margin-top:20px;
    color:#777;
}

</style>
</head>
<body>

<div class="payment-card">

    <div class="header">
        <h1>💳 Secure Payment</h1>
        <p>Choose your preferred payment method</p>
    </div>

    <div class="content">

        <div class="total-box">
            <h2>Order Total</h2>
            <h1>₹{{ total }}</h1>
        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="option">
                <input type="radio"
                       id="cod"
                       name="payment_method"
                       value="Cash On Delivery"
                       required>

                <label for="cod">
                    💵 Cash On Delivery
                </label>
            </div>

            <div class="option">
                <input type="radio"
                       id="upi"
                       name="payment_method"
                       value="UPI">

                <label for="upi">
                    📱 UPI Payment
                </label>
            </div>

            <div class="option">
                <input type="radio"
                       id="card"
                       name="payment_method"
                       value="Card">

                <label for="card">
                    💳 Debit / Credit Card
                </label>
            </div>

            <button type="submit" class="place-order">
                🛒 Place Order
            </button>

        </form>

        <div class="secure">
            🔒 100% Secure Checkout
        </div>

    </div>

</div>

</body>
</html>
