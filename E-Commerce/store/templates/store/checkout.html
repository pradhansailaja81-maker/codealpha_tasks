<!DOCTYPE html>
<html>
<head>
<title>Checkout</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.container{
    width:100%;
    max-width:650px;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

.logo{
    text-align:center;
    font-size:60px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    color:#333;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#444;
}

input,
textarea{
    width:100%;
    padding:15px;
    border:2px solid #e0e0e0;
    border-radius:12px;
    font-size:16px;
    transition:0.3s;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#667eea;
}

textarea{
    resize:none;
}

.order-box{
    background:#f8f9ff;
    padding:15px;
    border-radius:15px;
    margin-bottom:25px;
    border-left:5px solid #667eea;
}

.order-box h3{
    color:#333;
    margin-bottom:8px;
}

.order-box p{
    color:#666;
}

.btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#667eea,#764ba2);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.secure{
    text-align:center;
    margin-top:20px;
    color:#666;
}

@media(max-width:600px){

.container{
    padding:25px;
}

h1{
    font-size:28px;
}

}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        📦
    </div>

    <h1>Checkout</h1>

    <p class="subtitle">
        Complete your delivery details
    </p>

    <div class="order-box">
        <h3>🚚 Delivery Information</h3>
        <p>Please enter your shipping address correctly.</p>
    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>👤 Full Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required>
        </div>

        <div class="form-group">
            <label>📱 Phone Number</label>
            <input
                type="text"
                name="phone"
                placeholder="Enter your phone number"
                required>
        </div>

        <div class="form-group">
            <label>🏠 Delivery Address</label>
            <textarea
                name="address"
                rows="5"
                placeholder="Enter your complete address"
                required></textarea>
        </div>

        <button type="submit" class="btn">
            Continue To Payment 💳
        </button>

    </form>

    <div class="secure">
        🔒 Safe & Secure Checkout
    </div>

</div>

</body>
</html>
