<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{
    width:420px;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
    animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    text-align:center;
    font-size:60px;
    margin-bottom:10px;
}

h2{
    text-align:center;
    color:#333;
    margin-bottom:8px;
    font-size:32px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:30px;
}

.input-box{
    margin-bottom:18px;
}

.input-box input{
    width:100%;
    padding:15px;
    border:2px solid #e0e0e0;
    border-radius:12px;
    font-size:16px;
    transition:0.3s;
}

.input-box input:focus{
    border-color:#667eea;
    outline:none;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#667eea,#764ba2);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
}

.signup-link{
    text-align:center;
    margin-top:20px;
}

.signup-link a{
    text-decoration:none;
    color:#667eea;
    font-weight:bold;
}

.signup-link a:hover{
    text-decoration:underline;
}

.message{
    background:#ffe6e6;
    color:red;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        🔐
    </div>

    <h2>Welcome Back</h2>

    <p class="subtitle">
        Login to continue shopping
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="input-box">
            <input
                type="text"
                name="username"
                placeholder="👤 Username"
                required>
        </div>

        <div class="input-box">
            <input
                type="password"
                name="password"
                placeholder="🔒 Password"
                required>
        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <div class="signup-link">

        Don't have an account?

        <br><br>

        <a href="{% url 'signup' %}">
            Create New Account →
        </a>

    </div>

</div>

</body>
</html>
