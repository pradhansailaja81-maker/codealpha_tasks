{% extends "base.html" %}

{% block content %}

<div class="form-box">

    <h2>Edit Post</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Update Post
        </button>

    </form>

</div>

{% endblock %}
