{% extends "base.html" %}

{% block content %}

<h2>Search Users</h2>

{% if query %}
<p>Results for "<strong>{{ query }}</strong>"</p>
{% endif %}

{% for user in users %}

<div class="post-card">

    <h3>{{ user.username }}</h3>

    <a href="{% url 'profile' user.username %}" class="btn">
        View Profile
    </a>

</div>

{% empty %}

<p>No users found.</p>

{% endfor %}

{% endblock %}
